<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | Digital Dairy</title>
    <link rel="stylesheet" href="/static/css/customer_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background-color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
    
    <div style="max-width: 450px; width: 100%;">
        <!-- Logo -->
        <div style="text-align: center; margin-bottom: 40px;">
            <a href="/" class="logo" style="justify-content: center;">
                <i class="fas fa-droplet" style="color: var(--primary);"></i> DIGITAL DAIRY
            </a>
        </div>

        <div class="card animate-up" style="padding: 40px; border-radius: 30px; box-shadow: 0 40px 80px -20px rgba(0,0,0,0.1); border: none;">
            <h2 style="font-weight: 800; margin-bottom: 8px; text-align: center;">Welcome Back</h2>
            <p style="text-align: center; color: var(--text-meta); margin-bottom: 35px; font-size: 0.95rem;">Login to your customer portal</p>

            {% if messages %}
                {% for message in messages %}
                    <div style="background: #fef2f2; color: #dc2626; padding: 12px 16px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; margin-bottom: 20px; border: 1px solid #fee2e2;">
                        <i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 700; color: var(--text-meta); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px;">Phone Number</label>
                    <div style="position: relative;">
                        <i class="fas fa-phone" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-meta); font-size: 0.9rem;"></i>
                        <input type="text" name="phone" placeholder="Registered Phone" required style="width: 100%; padding: 15px 15px 15px 45px; border-radius: 14px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 600; font-family: inherit; font-size: 0.95rem;">
                    </div>
                </div>

                <div style="margin-bottom: 30px;">
                    <label style="display: block; font-weight: 700; color: var(--text-meta); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px;">Access Password</label>
                    <div style="position: relative;">
                        <i class="fas fa-lock" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-meta); font-size: 0.9rem;"></i>
                        <input type="password" name="password" placeholder="••••••••" required style="width: 100%; padding: 15px 15px 15px 45px; border-radius: 14px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 600; font-family: inherit; font-size: 0.95rem;">
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 16px; justify-content: center; font-size: 1rem; border-radius: 14px;">
                    Login to Portal <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div style="margin-top: 30px; text-align: center;">
                <p style="color: var(--text-meta); font-size: 0.85rem; margin-bottom: 0;">Don't have access? <br>Ask your dairy owner to set up your login.</p>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="/" style="text-decoration: none; color: var(--text-meta); font-weight: 700; font-size: 0.85rem;">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

</body>
</html>
