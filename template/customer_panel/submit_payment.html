<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete UPI Payment | Digital Dairy</title>
    <link rel="stylesheet" href="/static/css/customer_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        function generateRandomTransactionId() {
            // Generates a mock 12-digit transaction ID that starts with a recognizable pattern
            return "UPI" + Math.floor(100000000 + Math.random() * 900000000);
        }
    </script>
</head>
<body style="background-color: #f8fafc; font-family: 'Outfit', sans-serif;">
    <nav class="nav">
        <div class="container nav-inner">
            <a href="{% url 'customer_home' %}" class="logo">
                <i class="fas fa-droplet" style="color: var(--primary);"></i> DIGITAL DAIRY
            </a>
            <ul class="nav-links">

                <li><a href="{% url 'customer_my_orders' %}">Orders</a></li>
            </ul>
        </div>
    </nav>

    <main class="container" style="margin-top: 60px; margin-bottom: 80px;">
        <div style="max-width: 500px; margin: 0 auto;">
            <div class="card animate-up" style="padding: 0; overflow: hidden; border: none; box-shadow: 0 30px 60px -12px rgba(0,0,0,0.1); border-radius: 30px;">
                <div style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 40px 30px; color: white; text-align: center;">
                    <h2 style="font-weight: 800; margin-bottom: 10px;">Complete Payment</h2>
                    <p style="opacity: 0.9; margin: 0; font-size: 1.1rem;">Amount to Pay</p>
                    <div style="font-weight: 900; font-size: 3rem; margin-top: 10px;">
                        ₹ {% if latest_order %}{{ latest_order.total }}{% else %}0.00{% endif %}
                    </div>
                </div>

                <div style="padding: 40px 30px; text-align: center;">
                    <p style="font-weight: 600; color: var(--text-meta); margin-bottom: 20px;">Scan using any UPI App</p>
                    
                    <div style="display: inline-block; padding: 20px; background: white; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; margin-bottom: 30px;">
                        <!-- Styled Dummy QR Code -->
                        <div style="width: 220px; height: 220px; background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">
                            <i class="fas fa-qrcode" style="font-size: 100px; color: var(--primary); opacity: 0.8;"></i>
                            <div style="margin-top: 15px; font-weight: 800; color: var(--text-main); font-size: 0.9rem; border: 1px solid var(--primary); padding: 5px 15px; border-radius: 50px; background: #eff6ff;">
                                DIGITAL DAIRY
                            </div>
                        </div>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div style="background: #ecfdf5; color: #059669; padding: 15px; border-radius: 15px; font-weight: 700; margin-bottom: 25px;">
                                <i class="fas fa-check-circle me-2"></i> {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" onsubmit="document.getElementById('hidden_txn_id').value = generateRandomTransactionId();">
                        {% csrf_token %}
                        <input type="hidden" name="amount" value="{% if latest_order %}{{ latest_order.total }}{% else %}0{% endif %}">
                        <input type="hidden" name="transaction_id" id="hidden_txn_id" value="">
                        
                        <button type="submit" class="btn-primary" style="width: 100%; padding: 20px; font-size: 1.2rem; justify-content: center; border-radius: 20px; box-shadow: 0 15px 30px -10px rgba(37,99,235,0.4);">
                            I Have Paid <i class="fas fa-check-double ms-2"></i>
                        </button>
                    </form>
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 30px;">
                <a href="{% url 'customer_my_orders' %}" style="text-decoration: none; color: var(--text-meta); font-weight: 700;">
                    Complete Later <i class="fas fa-arrow-right ms-2"></i>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
