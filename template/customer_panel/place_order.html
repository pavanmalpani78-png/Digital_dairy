<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order | Digital Dairy</title>
    <link rel="stylesheet" href="/static/css/customer_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background-color: #f8fafc;">
    <nav class="nav">
        <div class="container nav-inner">
            <a href="{% url 'customer_dashboard' %}" class="logo">
                <i class="fas fa-droplet" style="color: var(--primary);"></i> DIGITAL DAIRY
            </a>
            <ul class="nav-links">

                <li><a href="{% url 'customer_dashboard' %}">Dashboard</a></li>
                <li><a href="{% url 'customer_my_orders' %}">Orders</a></li>
                <li><a href="{% url 'customer_logout' %}" class="btn-primary" style="padding: 8px 16px; background: #ef4444; font-size: 0.8rem;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container" style="margin-top: 40px; margin-bottom: 80px;">
        <div style="max-width: 800px; margin: 0 auto;">
            <div class="card animate-up" style="padding: 0; overflow: hidden; border: none; box-shadow: 0 30px 60px -12px rgba(0,0,0,0.1);">
                <div style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 40px; color: white;">
                    <h2 style="font-weight: 800; margin-bottom: 10px;">Select Your Items</h2>
                    <p style="opacity: 0.8; margin: 0;">Fill in the details below to place your fresh dairy order.</p>
                </div>

                <form method="POST" style="padding: 40px;" id="addOrderForm">
                    {% csrf_token %}
                    
                    <div style="margin-bottom: 30px;">
                        <label style="display: block; font-weight: 700; color: var(--text-meta); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 15px;">1. Select Product Category</label>
                        <select name="product_type" id="id_product_type" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 600;" onchange="toggleOrderFields()">
                            <option value="MILK">Milk</option>
                            <option value="CURD">Curd</option>
                            <option value="PANEER">Paneer</option>
                            <option value="GHEE">Ghee</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                    
                    <div style="margin-bottom: 30px;">
                        <label style="display: block; font-weight: 700; color: var(--text-meta); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 15px;">Delivery Date</label>
                        <input type="date" name="date" class="form-control" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 600;" {% if selected_date %}value="{{ selected_date }}"{% endif %} required>
                    </div>

                    <!-- Milk Section -->
                    <div id="milk_section" style="display: block;">
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 25px;">
                            <div style="flex: 1;">
                                <label style="display: block; font-weight: 700; color: var(--text-meta); font-size: 0.85rem; margin-bottom: 8px;">Brand</label>
                                <select name="brand" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 600;">
                                    <option value="AMUL">Amul</option>
                                    <option value="VIKAS">Vikas</option>
                                    <option value="SARASWATI">Saraswati</option>
                                    <option value="OTHER">Other/Local</option>
                                </select>
                            </div>
                            <div style="flex: 1;">
                                <label style="display: block; font-weight: 700; color: var(--text-meta); font-size: 0.85rem; margin-bottom: 8px;">Milk Type</label>
                                <select name="milk_type" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 600;">
                                    <option value="BUFFALO">Buffalo</option>
                                    <option value="COW">Cow</option>
                                </select>
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                            <div style="flex: 1;">
                                <label style="display: block; font-weight: 700; color: var(--text-meta); font-size: 0.85rem; margin-bottom: 8px;">Pack Size</label>
                                <select name="pack_size" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 600;">
                                    <option value="0.5">0.5 L</option>
                                    <option value="1.0">1.0 L</option>
                                </select>
                            </div>
                            <div style="flex: 1;">
                                <label style="display: block; font-weight: 700; color: var(--text-meta); font-size: 0.85rem; margin-bottom: 8px;">Packets</label>
                                <input type="number" name="packets" value="1" min="1" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 600;">
                            </div>
                        </div>
                    </div>

                    <!-- Other Section -->
                    <div id="other_section" style="display: none;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                            <div style="flex: 1;">
                                <label style="display: block; font-weight: 700; color: var(--text-meta); font-size: 0.85rem; margin-bottom: 8px;">Quantity</label>
                                <input type="number" name="quantity" step="0.01" value="0" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 600;">
                            </div>
                            <div style="flex: 1;">
                                <label style="display: block; font-weight: 700; color: var(--text-meta); font-size: 0.85rem; margin-bottom: 8px;">Unit</label>
                                <input type="text" name="unit" placeholder="e.g. KG" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 600;">
                            </div>
                        </div>
                    </div>

                    <!-- Payment is handled by shopkeeper (COD default) -->
                    <input type="hidden" name="payment_method" value="COD">

                    <button type="submit" class="btn-primary justify-content-center" style="width: 100%; padding: 20px; font-size: 1.1rem; margin-top: 40px; box-shadow: 0 20px 40px -10px rgba(37,99,235,0.4);">
                        Confirm Order <i class="fas fa-check-circle"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        function toggleOrderFields() {
            const productType = document.getElementById('id_product_type').value;
            const milkSec = document.getElementById('milk_section');
            const otherSec = document.getElementById('other_section');

            if (productType === 'MILK') {
                milkSec.style.display = 'block';
                otherSec.style.display = 'none';
            } else {
                milkSec.style.display = 'none';
                otherSec.style.display = 'block';
            }
        }

        // Initial trigger
        window.addEventListener('DOMContentLoaded', toggleOrderFields);


    </script>

    <footer style="margin-top: 0;">
        <div class="container">
            <p style="font-size: 0.9rem;">&copy; 2026 Digital Dairy Management System.</p>
        </div>
    </footer>
</body>
</html>
