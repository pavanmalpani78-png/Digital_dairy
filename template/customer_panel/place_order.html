{% extends 'customer_panel/customer_base.html' %}

{% block title %}Place Order | Customer Portal{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center">
    <div class="card-enterprise w-100" style="max-width: 800px; overflow: hidden; border: none;">
        <div class="p-4 p-md-5 bg-primary text-white">
            <h2 class="fw-700 mb-2">Select Your Items</h2>
            <p class="mb-0 opacity-75">Fill in the details below to place your fresh dairy order.</p>
        </div>

        <div class="p-4 p-md-5">
            <form method="POST" id="addOrderForm">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">1. Select Product Category</label>
                    <select name="product_type" id="id_product_type" class="form-select form-select-lg bg-light border-0 fw-600" onchange="toggleOrderFields()">
                        <option value="MILK">Milk</option>
                        <option value="CURD">Curd</option>
                        <option value="PANEER">Paneer</option>
                        <option value="GHEE">Ghee</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Delivery Date</label>
                    <input type="date" name="date" class="form-control form-control-lg bg-light border-0 fw-600"
                        {% if selected_date %}value="{{ selected_date }}" {% endif %} required>
                </div>

                <!-- Brand Section -->
                <div id="brand_section" style="display: block;">
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-700 text-muted small">Brand</label>
                            <select name="brand" class="form-select form-select-lg bg-light border-0 fw-600">
                                <option value="AMUL">Amul</option>
                                <option value="VIKAS">Vikas</option>
                                <option value="SARASWATI">Saraswati</option>
                                <option value="OTHER">Other/Local</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-700 text-muted small">Milk Type</label>
                            <select name="milk_type" class="form-select form-select-lg bg-light border-0 fw-600">
                                <option value="BUFFALO">Buffalo</option>
                                <option value="COW">Cow</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Packets Section -->
                <div id="packet_section" style="display: block;">
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-700 text-muted small">Pack Size (Liters)</label>
                            <select name="pack_size" class="form-select form-select-lg bg-light border-0 fw-600">
                                <option value="">-- No Pack Size --</option>
                                <option value="0.5">0.5 Ltr</option>
                                <option value="1.0">1.0 Ltr</option>
                                <option value="2.0">2.0 Ltr</option>
                                <option value="5.0">5.0 Ltr</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-700 text-muted small">Packets</label>
                            <input type="number" name="packets" value="0" min="0" class="form-control form-control-lg bg-light border-0 fw-600">
                        </div>
                    </div>
                </div>

                <!-- Other Section -->
                <div id="other_section" style="display: none;">
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-700 text-muted small">Quantity</label>
                            <input type="number" name="quantity" step="0.01" value="0" class="form-control form-control-lg bg-light border-0 fw-600">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-700 text-muted small">Unit</label>
                            <input type="text" name="unit" placeholder="e.g. KG" class="form-control form-control-lg bg-light border-0 fw-600">
                        </div>
                    </div>
                </div>

                <!-- Payment is handled by shopkeeper (COD default) -->
                <input type="hidden" name="payment_method" value="COD">

                <button type="submit" class="btn btn-primary w-100 py-3 mt-4 fw-700 fs-5 rounded-3">
                    Confirm Order <i class="bi bi-check-circle-fill ms-2"></i>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function toggleOrderFields() {
        const productType = document.getElementById('id_product_type').value;
        const brandSec = document.getElementById('brand_section');
        const otherSec = document.getElementById('other_section');

        if (productType === 'MILK') {
            brandSec.style.display = 'block';
            otherSec.style.display = 'none';
        } else {
            brandSec.style.display = 'none';
            otherSec.style.display = 'block';
        }
    }

    // Initial trigger
    window.addEventListener('DOMContentLoaded', toggleOrderFields);
</script>
{% endblock %}
