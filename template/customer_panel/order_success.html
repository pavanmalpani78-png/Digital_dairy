<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed Successfully - Digital Dairy</title>
    <link rel="stylesheet" href="/static/css/customer_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .success-card {
            max-width: 500px;
            margin: 100px auto;
            text-align: center;
            padding: 50px;
        }
        .success-icon {
            font-size: 60px;
            color: #27ae60;
            margin-bottom: 25px;
            animation: scaleIn 0.5s ease-out;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="container nav-inner">
            <a href="{% url 'customer_dashboard' %}" class="logo">
                <i class="fas fa-droplet"></i> DIGITAL DAIRY
            </a>
        </div>
    </nav>

    <main class="container">
        <div class="card success-card">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 style="font-size: 2rem; margin-bottom: 15px;">Order Placed!</h2>
            <p style="color: var(--text-meta); font-size: 1.1rem; margin-bottom: 30px;">
                Thank you for your order. We have received it and it is currently <strong>pending approval</strong> from the shopkeeper.
            </p>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <a href="{% url 'customer_my_orders' %}" class="btn-primary" style="background: var(--primary);">
                    <i class="fas fa-list"></i> View My Orders
                </a>
                <a href="{% url 'customer_dashboard' %}" style="text-decoration: none; color: var(--text-meta); font-weight: 600;">
                    <i class="fas fa-home"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Digital Dairy. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
