{% extends "base.html" %}

{% block title %}Edit Order | Milk Khata Digital Dairy{% endblock %}

{% block content %}
<div class="glass-card overflow-hidden" style="max-width: 800px; margin: 0 auto;">
    <div class="bg-primary p-4 text-white d-flex justify-content-between align-items-center">
        <div>
            <h3 class="fw-800 mb-1 text-white">Edit Order</h3>
            <p class="mb-0 opacity-75 small">Modify the details of this delivery record</p>
        </div>
        <a href="{% url 'milk_order' %}?date={{ order.date|date:'Y-m-d' }}" class="btn btn-light rounded-pill px-4 fw-600">
            <i class="bi bi-arrow-left me-1"></i> Back
        </a>
    </div>

    <div class="p-4 p-md-5">
        <form method="POST">
            {% csrf_token %}
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Customer</label>
                    <select name="customer" class="form-select bg-light border-0 py-3 rounded-4" required>
                        {% for c in customers %}
                        <option value="{{ c.id }}" {% if order.customer_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Order Date</label>
                    <input type="date" name="date" class="form-control bg-light border-0 py-3 rounded-4" value="{{ order.date|date:'Y-m-d' }}" required>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Product Type</label>
                    <select name="product_type" id="id_product_type" class="form-select bg-light border-0 py-3 rounded-4" required onchange="toggleOrderFields()">
                        <option value="MILK" {% if order.product_type == "MILK" %}selected{% endif %}>Milk</option>
                        <option value="GHEE" {% if order.product_type == "GHEE" %}selected{% endif %}>Ghee</option>
                        <option value="PANEER" {% if order.product_type == "PANEER" %}selected{% endif %}>Paneer</option>
                        <option value="CURD" {% if order.product_type == "CURD" %}selected{% endif %}>Curd</option>
                        <option value="BUTTER" {% if order.product_type == "BUTTER" %}selected{% endif %}>Butter</option>
                    </select>
                </div>

                <!-- Milk Specific Fields -->
                <div class="col-md-6 brand-fields">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Brand</label>
                    <select name="brand" class="form-select bg-light border-0 py-3 rounded-4">
                        <option value="AMUL" {% if order.brand == "AMUL" %}selected{% endif %}>Amul</option>
                        <option value="VIKAS" {% if order.brand == "VIKAS" %}selected{% endif %}>Vikas</option>
                        <option value="SARASWATI" {% if order.brand == "SARASWATI" %}selected{% endif %}>Saraswati</option>
                        <option value="OTHER" {% if order.brand == "OTHER" %}selected{% endif %}>Other/Local</option>
                    </select>
                </div>

                <div class="col-md-6 brand-fields">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Milk Type</label>
                    <select name="milk_type" class="form-select bg-light border-0 py-3 rounded-4">
                        <option value="BUFFALO" {% if order.milk_type == "BUFFALO" %}selected{% endif %}>Buffalo</option>
                        <option value="COW" {% if order.milk_type == "COW" %}selected{% endif %}>Cow</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Pack Size</label>
                    <input type="number" step="0.01" name="pack_size" class="form-control bg-light border-0 py-3 rounded-4" value="{{ order.pack_size|default_if_none:'' }}" placeholder="e.g. 0.5 (leave empty if not packet)">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Packets</label>
                    <input type="number" name="packets" class="form-control bg-light border-0 py-3 rounded-4" value="{{ order.packets|default:'0' }}" min="0">
                </div>

                <!-- Non-Milk Generic Fields (Hidden for Milk) -->
                <div class="col-md-4 other-fields d-none">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Quantity</label>
                    <input type="number" step="0.01" name="quantity" class="form-control bg-light border-0 py-3 rounded-4 shadow-none" value="{{ order.quantity }}">
                </div>

                <div class="col-md-4 other-fields d-none">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Unit</label>
                    <input type="text" name="unit" class="form-control bg-light border-0 py-3 rounded-4 shadow-none" value="{{ order.unit }}" placeholder="e.g. KG">
                </div>

                <div class="col-md-4 other-fields d-none">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Rate (₹)</label>
                    <input type="number" step="0.01" name="rate" class="form-control bg-light border-0 py-3 rounded-4 shadow-none" value="{{ order.rate }}">
                </div>
                
                <div class="col-12 mt-5">
                    <div class="d-flex gap-3">
                        <button class="btn-premium px-5 py-3 justify-content-center flex-grow-1">
                            Update Order <i class="bi bi-check2-circle ms-2"></i>
                        </button>
                        <a href="{% url 'milk_order' %}?date={{ order.date|date:'Y-m-d' }}" class="btn btn-outline-secondary border-2 rounded-4 px-4 py-3 fw-600">Cancel</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<style>
    .tracking-wider { letter-spacing: 0.05em; }
    .fw-800 { font-weight: 800; }
    .fw-700 { font-weight: 700; }
    input, select {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem !important;
        border: none !important;
        background-color: #f8fafc !important;
        font-weight: 500;
        font-size: 0.95rem;
    }
</style>

<script>
    function toggleOrderFields() {
        const productType = document.getElementById('id_product_type').value;
        const brandFields = document.querySelectorAll('.brand-fields');
        const otherFields = document.querySelectorAll('.other-fields'); // Rate, Qty, Unit

        if (productType === 'MILK') {
            brandFields.forEach(f => f.classList.remove('d-none'));
            otherFields.forEach(f => f.classList.add('d-none'));
        } else {
            brandFields.forEach(f => f.classList.add('d-none'));
            otherFields.forEach(f => f.classList.remove('d-none'));
        }
    }
    
    // Initial trigger
    window.addEventListener('DOMContentLoaded', toggleOrderFields);
</script>
{% endblock %}
