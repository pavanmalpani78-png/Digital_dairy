{% extends "base.html" %}

{% block title %}Edit Customer | Milk Khata Digital Dairy{% endblock %}

{% block content %}
<div class="glass-card overflow-hidden" style="max-width: 800px; margin: 0 auto;">
    <div class="bg-primary p-4 text-white d-flex justify-content-between align-items-center">
        <div>
            <h3 class="fw-800 mb-1 text-white">Edit Customer</h3>
            <p class="mb-0 opacity-75 small">Modify details for {{ customer.name }}</p>
        </div>
        <a href="{% url 'customer_page' %}" class="btn btn-light rounded-pill px-4 fw-600">
            <i class="bi bi-arrow-left me-1"></i> Back
        </a>
    </div>

    <div class="p-4 p-md-5">
        <form method="POST">
            {% csrf_token %}
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Full Name</label>
                    <input type="text" class="form-control" name="name" value="{{ customer.name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Phone Number</label>
                    <input type="text" class="form-control" name="phone" value="{{ customer.phone|default:'' }}">
                </div>
                <div class="col-12">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Residence Address</label>
                    <textarea class="form-control" name="address" rows="2">{{ customer.address|default:'' }}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Balance (₹)</label>
                    <input type="number" step="0.01" class="form-control" name="balance" value="{{ customer.balance }}">
                </div>
                
                <!-- Login Credentials -->
                <div class="col-12 mt-4">
                    <h5 class="fw-800 text-primary mb-3">Customer Panel Login (Optional)</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Login Phone</label>
                            <input type="text" class="form-control" name="login_phone" value="{{ customer.login_phone|default:'' }}">
                            <div class="small text-muted mt-1">Used for customer to login</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Login Password</label>
                            <input type="password" class="form-control" name="login_password" value="{{ customer.login_password|default:'' }}">
                            <div class="small text-muted mt-1">Keep it secure</div>
                        </div>
                    </div>
                </div>
                
                <div class="col-12 mt-5">
                    <div class="d-flex gap-3">
                        <button type="submit" class="btn-premium px-5 py-3 justify-content-center flex-grow-1">
                            Update Customer <i class="bi bi-check-circle-fill ms-2"></i>
                        </button>
                        <a href="{% url 'customer_page' %}" class="btn btn-outline-secondary border-2 rounded-4 px-4 py-3 fw-600">Cancel</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<style>
    .tracking-wider { letter-spacing: 0.05em; }
    .fw-800 { font-weight: 800; }
    .fw-700 { font-weight: 700; }
    .form-control {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem !important;
        border: none !important;
        background-color: #f8fafc !important;
        font-weight: 500;
    }
    .form-control:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 97, 255, 0.1) !important;
    }
</style>
{% endblock %}
