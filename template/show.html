<!DOCTYPE html>
<html>

<head>
    <title>Database Data</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 20px;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background: #4CAF50;
            color: white;
        }
    </style>
</head>

<body>

    <h2 style="text-align:center;">📊 All Database Records</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
        </tr>

        {% for i in data %}
        <tr>
            <td>{{ i.id }}</td>
            <td>{{ i.name }}</td>
        </tr>
        {% endfor %}

    </table>

</body>

</html>
