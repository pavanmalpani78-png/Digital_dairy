{% extends 'base.html' %}
{% load static %}

{% block title %}Add Subscription | Milk Khata Digital Dairy{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-enterprise p-4 p-md-5">
            <h3 class="fw-800 mb-2">Create Subscription</h3>
            <p class="text-muted mb-4">Set up an automated recurring daily order for a customer.</p>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-600 small text-uppercase tracking-wider text-muted">Customer</label>
                    <select name="customer" class="form-select bg-light border-0 py-3 rounded-4" required>
                        <option value="" selected disabled>-- Select Customer --</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-600 small text-uppercase tracking-wider text-muted">Product Type</label>
                    <select id="product_type" name="product_type" class="form-select bg-light border-0 py-3 rounded-4" required onchange="toggleFields()">
                        {% for code, name in product_types %}
                        <option value="{{ code }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div id="milk-fields">
                    <div class="mb-3">
                        <label class="form-label fw-600 small text-uppercase tracking-wider text-muted">Milk Brand</label>
                        <select name="brand" class="form-select bg-light border-0 py-3 rounded-4">
                            {% for code, name in milk_brands %}
                            <option value="{{ code }}">{{ name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-600 small text-uppercase tracking-wider text-muted">Milk Type</label>
                        <select name="milk_type" class="form-select bg-light border-0 py-3 rounded-4">
                            {% for code, name in milk_types %}
                            <option value="{{ code }}">{{ name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3 row">
                        <div class="col-6">
                            <label class="form-label fw-600 small text-uppercase tracking-wider text-muted">Pack Size (Liters)</label>
                            <input type="number" step="0.5" class="form-control bg-light border-0 py-3 rounded-4" name="pack_size" placeholder="e.g. 0.5" value="0.5">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-600 small text-uppercase tracking-wider text-muted">No. of Packets</label>
                            <input type="number" class="form-control bg-light border-0 py-3 rounded-4" name="packets" placeholder="e.g. 2" value="1">
                        </div>
                    </div>
                </div>

                <div id="other-fields" style="display:none;">
                    <div class="mb-3 row">
                        <div class="col-4">
                            <label class="form-label fw-600 small text-uppercase tracking-wider text-muted">Qty</label>
                            <input type="number" step="0.01" class="form-control bg-light border-0 py-3 rounded-4" name="quantity" placeholder="0">
                        </div>
                        <div class="col-4">
                            <label class="form-label fw-600 small text-uppercase tracking-wider text-muted">Unit</label>
                            <input type="text" class="form-control bg-light border-0 py-3 rounded-4" name="unit" placeholder="e.g. Kg">
                        </div>
                        <div class="col-4">
                            <label class="form-label fw-600 small text-uppercase tracking-wider text-muted">Rate</label>
                            <input type="number" step="0.01" class="form-control bg-light border-0 py-3 rounded-4" name="rate" placeholder="₹">
                        </div>
                    </div>
                </div>

                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" role="switch" id="is_active" name="is_active" checked>
                    <label class="form-check-label fw-600" for="is_active">Active immediately</label>
                </div>
                
                <div class="d-flex gap-2 justify-content-end">
                    <a href="{% url 'subscription_list' %}" class="btn btn-light btn-lg rounded-pill px-4 fw-600">Cancel</a>
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 fw-600 shadow-sm">Save Subscription</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function toggleFields() {
    var type = document.getElementById("product_type").value;
    if (type === "MILK") {
        document.getElementById("milk-fields").style.display = "block";
        document.getElementById("other-fields").style.display = "none";
    } else {
        document.getElementById("milk-fields").style.display = "none";
        document.getElementById("other-fields").style.display = "block";
    }
}
</script>
{% endblock %}
