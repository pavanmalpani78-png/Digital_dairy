{% extends 'base.html' %}
{% load static %}

{% block title %}Record New Delivery | Milk Khata{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="glass-card overflow-hidden">
            <!-- Header -->
            <div class="bg-primary p-4 text-white d-flex align-items-center justify-content-between">
                <div>
                    <h3 class="fw-800 mb-1 text-white">Record New Delivery</h3>
                    <p class="mb-0 opacity-75 small">Enter the delivery details for your customer</p>
                </div>
                <a href="{% url 'milk_order' %}" class="btn btn-sm btn-light rounded-pill px-3 fw-600">
                    <i class="bi bi-arrow-left me-1"></i> Back to List
                </a>
            </div>

            <!-- Form -->
            <div class="p-4 p-md-5">
                <form method="POST" action="{% url 'add_milk_order' %}" id="addOrderForm">
                    {% csrf_token %}
                    
                    <div class="row g-4">
                        <!-- Customer Selection -->
                        <div class="col-md-12">
                            <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Customer</label>
                            <select name="customer" class="form-select bg-light border-0 py-3 rounded-4 shadow-none" required>
                                <option value="" disabled selected>-- Select Customer --</option>
                                {% for c in customers %}
                                    <option value="{{ c.id }}">{{ c.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Product Type -->
                        <div class="col-md-6">
                            <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Product Type</label>
                            <select name="product_type" id="id_product_type" class="form-select bg-light border-0 py-3 rounded-4 shadow-none" required onchange="toggleOrderFields()">
                                <option value="MILK">Milk</option>
                                <option value="CURD">Curd</option>
                                <option value="PANEER">Paneer</option>
                                <option value="GHEE">Ghee</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>

                        <!-- Date -->
                        <div class="col-md-6">
                            <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Delivery Date</label>
                            <input type="date" name="date" class="form-control bg-light border-0 py-3 rounded-4 shadow-none" value="{{ selected_date }}" required>
                        </div>

                        <!-- Milk Specific Fields -->
                        <div class="col-md-6 milk-fields">
                            <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Brand</label>
                            <select name="brand" class="form-select bg-light border-0 py-3 rounded-4 shadow-none">
                                <option value="AMUL">Amul</option>
                                <option value="VIKAS">Vikas</option>
                                <option value="SARASWATI">Saraswati</option>
                                <option value="OTHER">Other/Local</option>
                            </select>
                        </div>

                        <div class="col-md-6 milk-fields">
                            <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Milk Type</label>
                            <select name="milk_type" class="form-select bg-light border-0 py-3 rounded-4 shadow-none">
                                <option value="BUFFALO">Buffalo</option>
                                <option value="COW">Cow</option>
                            </select>
                        </div>

                        <div class="col-md-6 milk-fields">
                            <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Pack Size</label>
                            <select name="pack_size" class="form-select bg-light border-0 py-3 rounded-4 shadow-none">
                                <option value="0.5">0.5 L</option>
                                <option value="1.0">1.0 L</option>
                            </select>
                        </div>

                        <div class="col-md-6 milk-fields">
                            <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Packets</label>
                            <input type="number" name="packets" class="form-control bg-light border-0 py-3 rounded-4 shadow-none" value="1" min="1">
                        </div>

                        <!-- Non-Milk Generic Fields (Hidden for Milk) -->
                        <div class="col-md-4 other-fields d-none">
                            <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Quantity</label>
                            <input type="number" step="0.01" name="quantity" class="form-control bg-light border-0 py-3 rounded-4 shadow-none" value="0">
                        </div>

                        <div class="col-md-4 other-fields d-none">
                            <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Unit</label>
                            <input type="text" name="unit" class="form-control bg-light border-0 py-3 rounded-4 shadow-none" placeholder="e.g. KG">
                        </div>

                        <div class="col-md-4 other-fields d-none">
                            <label class="form-label fw-700 text-muted small text-uppercase tracking-wider">Rate (₹)</label>
                            <input type="number" step="0.01" name="rate" class="form-control bg-light border-0 py-3 rounded-4 shadow-none" value="0">
                        </div>

                        <!-- Action Buttons -->
                        <div class="col-12 mt-4 pt-4 border-top">
                            <div class="d-flex gap-3">
                                <button type="button" onclick="window.history.back()" class="btn btn-light rounded-pill px-5 py-3 fw-600 text-muted border">
                                    Cancel
                                </button>
                                <button type="submit" class="btn-premium flex-grow-1 py-3 justify-content-center border-0 shadow-lg">
                                    Save Delivery Record <i class="bi bi-check2-circle ms-2"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
    function toggleOrderFields() {
        const productType = document.getElementById('id_product_type').value;
        const milkFields = document.querySelectorAll('.milk-fields');
        const otherFields = document.querySelectorAll('.other-fields');

        if (productType === 'MILK') {
            milkFields.forEach(f => f.classList.remove('d-none'));
            otherFields.forEach(f => f.classList.add('d-none'));
        } else {
            milkFields.forEach(f => f.classList.add('d-none'));
            otherFields.forEach(f => f.classList.remove('d-none'));
        }
    }
    
    // Initial trigger
    window.addEventListener('DOMContentLoaded', toggleOrderFields);
</script>
{% endblock %}

<style>
    .tracking-wider { letter-spacing: 0.08em; }
    .fw-800 { font-weight: 800; }
    .fw-700 { font-weight: 700; }
    .fw-600 { font-weight: 600; }
</style>
{% endblock %}
