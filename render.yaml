services:
  - type: web
    name: digital-dairy
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn khatabook.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-dairy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

databases:
  - name: digital-dairy-db
    databaseName: digital_dairy
    user: digital_dairy
    plan: basic-256mb
